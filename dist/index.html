<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>MyST Editor Integration</title>
    <link rel="icon" href="data:," />  
    <link rel="icon" href="data:," />
    <!-- <link
      rel="stylesheet"
      href="https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/dev/index.css"
    /> -->
    <script type="module" crossorigin src="./MainOverride.js"></script>
    <script type="module" crossorigin src="./MystEditor-DycCI9xg.js"></script>
    <link rel="stylesheet" crossorigin href="./PFXStyleOverride.css">
    <link rel="stylesheet" crossorigin href="./MystEditor.css">
  </head>
  <body>
    <div id="container">
    <div id="sidebar">
      <div id="tree-panel">
        <div class="controls">
          <div class="controls_row" >
            <button id="new-file" title="File">📄</button>
            <button id="new-folder" title="Folder">📁</button>
            <button id="delete" title="Delete">🗑️</button>
            <button id="rename" title="Rename">✏️</button>
            <button id="move" title="Move">👉🏻</button>
            <button id="upload-image" title="Upload">📤</button>
          </div>
        </div>
        <div id="tree"></div>
      </div>
      <div id="resizer-horizontal"></div>
      <div id="gitPanel">
        <input type="hidden" id="hidden-filename" value="">
        <label>Branch:</label>
        <select id="branchDropdown"></select>
        <label>Commit:</label>
        <select id="commitDropdown"></select>
        <label>Commit Details:</label>
        <pre id="commitDetails">Select a commit...</pre>
      </div>
    </div>
    <div id="resizer"></div>
    <div id="editor-panel" class="printable">
      <div id="myst"></div>
    </div>
  </div>
  </body>
</html>
