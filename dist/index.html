<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>MyST Editor Integration</title>
    <link rel="icon" href="data:," />  



    <link rel="icon" href="data:," />
    <link
      rel="stylesheet"
      href="https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/dev/index.css"
    />

    <script>
      window.EXCALIDRAW_ASSET_PATH =
        "https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/";
    </script>

     <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.0.0",
          "react/jsx-runtime": "https://esm.sh/react@19.0.0/jsx-runtime",
          "react-dom": "https://esm.sh/react-dom@19.0.0"
        }
      }
    </script>
    <script type="module" crossorigin src="./MainOverride.js"></script>
    <script type="module" crossorigin src="https://esm.sh/react@19.0.0"></script>
    <script type="module" crossorigin src="https://esm.sh/react-dom@19.0.0/client"></script>
    <script type="module" crossorigin src="https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/dev/index.js?external=react,react-dom"></script>
    <script type="module" crossorigin src="./MystEditor-D22XXGGf.js"></script>
    <link rel="stylesheet" crossorigin href="./PFXStyleOverride.css">
    <link rel="stylesheet" crossorigin href="./MystEditor.css">
  </head>
  <body>
    <div id="container">
    <div id="sidebar">
      <div id="tree-panel">
        <div class="controls">
          <div class="controls_row" >
            <button id="new-file">➕ File</button>
            <button id="new-folder">➕ Folder</button>
            <button id="delete">🗑️ Delete</button>
          </div>
          <div class="controls_row" >
            <button id="rename">✏️ Rename</button>
            <button id="move">📁 Move</button>
            <button id="upload-image">📤 Upload</button>
          </div>
        </div>
        <div id="tree"></div>
      </div>
      <div id="resizer-horizontal"></div>
      <div id="gitPanel">
        <input type="hidden" id="hidden-filename" value="">
        <label>Branch:</label>
        <select id="branchDropdown"></select>
        <label>Commit:</label>
        <select id="commitDropdown"></select>
        <label>Commit Details:</label>
        <pre id="commitDetails">Select a commit...</pre>
      </div>
    </div>
    <div id="resizer"></div>
    <div id="editor-panel" class="printable">
      <div id="myst"></div>
    </div>
  </div>
  </body>
</html>
